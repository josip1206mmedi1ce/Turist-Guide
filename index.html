<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turist Guide</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f9; color: #17212b; }

header { background: #0078e5; color: white; padding: 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); text-align: center; }
header h1 { margin: 0 0 6px 0; font-size: 24px; }
header p { margin: 0; font-size: 14px; opacity: 0.9; }

.main-container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

.search-box { display: flex; gap: 10px; margin-bottom: 12px; }
input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }

button { padding: 12px 18px; background: #0078e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
button:hover { background: #005bb5; }

.btn-near { background: #005bb5; margin-bottom: 15px; width: 100%; max-width: 250px; }

#map { width: 100%; height: 320px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

.status { margin-bottom: 15px; color: #555; font-size: 14px; }
.results-list { display: flex; flex-direction: column; gap: 16px; }

.card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #0078e5; display: flex; flex-direction: column; gap: 8px; }
.card h3 { margin: 0; font-size: 18px; color: #0078e5; }
.card p { margin: 0; font-size: 13px; color: #555; }
.card .distance { font-weight: bold; color: #27ae60; font-size: 14px; }
.card .rating { font-weight: bold; color: #f39c12; font-size: 13px; }

/* Galerija slika */
.photo-gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-top: 5px; -webkit-overflow-scrolling: touch; }
.photo-gallery img { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; cursor: pointer; flex-shrink: 0; transition: transform 0.2s; }
.photo-gallery img:hover { transform: scale(1.03); }

/* Modal za prikaz velike slike */
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
.modal img { max-width: 90%; max-height: 80%; border-radius: 8px; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
.modal-close { position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; }

.btn-maps {
display: inline-block;
margin-top: 8px;
padding: 10px 14px;
background: #34a853;
color: white;
text-decoration: none;
border-radius: 6px;
font-size: 13px;
font-weight: bold;
text-align: center;
align-self: flex-start;
}
.btn-maps:hover { background: #2d8e47; }
</style>
</head>
<body>

<header>
<h1>Turist Guide</h1>
<p>Pronađite turističke atrakcije u gradu</p>
</header>

<div class="main-container">
<div class="search-box">
<input type="text" id="cityInput" placeholder="Unesite grad (npr. Paris ili Dubrovnik)">
<button onclick="searchAttractions()">📍 Traži atrakcije</button>
</div>

<button class="btn-near" onclick="getNearAttractions()">📍 Atrakcije u mojoj blizini</button>

<div id="map"></div>

<div id="status" class="status">Unesite grad i kliknite "Traži atrakcije".</div>
<div class="results-list" id="results"></div>
</div>

<!-- Modal za veliku sliku -->
<div id="imageModal" class="modal" onclick="closeModal()">
<span class="modal-close" onclick="closeModal()">&times;</span>
<img id="modalImg" src="">
</div>

<script>
let map;
let service;
let markers = [];

const excludedTypes = [
'lodging', 'hotel', 'resort', 'guest_house', 'hostel',
'campground', 'restaurant', 'cafe', 'bar', 'food'
];

function initMap() {
const defaultPos = { lat: 48.8566, lng: 2.3522 };
map = new google.maps.Map(document.getElementById('map'), {
center: defaultPos,
zoom: 12
});
service = new google.maps.places.PlacesService(map);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
const R = 6371;
const dLat = (lat2 - lat1) * Math.PI / 180;
const dLon = (lon2 - lon1) * Math.PI / 180;
const a =
Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
Math.sin(dLon/2) * Math.sin(dLon/2);
const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
const d = R * c;

if (d < 1) {
return Math.round(d * 1000) + ' m';
}
return d.toFixed(1) + ' km';
}

function searchAttractions() {
const city = document.getElementById('cityInput').value.trim();
if (!city) {
alert('Molimo unesite grad.');
return;
}

document.getElementById('status').innerText = `Pretražujem atrakcije u gradu: ${city}...`;

const request = {
query: `tourist attractions point of interest in ${city}`,
type: 'tourist_attraction'
};

service.textSearch(request, (results, status) => {
if (status === google.maps.places.PlacesServiceStatus.OK && results) {
const centerLoc = results[0].geometry.location;
processResults(results, city, centerLoc, "od centra grada");
} else {
document.getElementById('status').innerText = 'Greška pri pretrazi ili grad nije pronađen.';
}
});
}

function getNearAttractions() {
if (!navigator.geolocation) {
alert('Geolokacija nije podržana u vašem pregledniku.');
return;
}

document.getElementById('status').innerText = 'Dohvatam vašu lokaciju...';

navigator.geolocation.getCurrentPosition((pos) => {
const userLoc = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
map.setCenter(userLoc);
map.setZoom(14);

const request = {
location: userLoc,
radius: '4000',
type: 'tourist_attraction'
};

service.nearbySearch(request, (results, status) => {
if (status === google.maps.places.PlacesServiceStatus.OK && results) {
processResults(results, 'vašoj blizini', userLoc, "od vaše trenutne lokacije");
} else {
document.getElementById('status').innerText = 'Nisu pronađene atrakcije u blizini.';
}
});
});
}

function processResults(results, locationLabel, referencePoint, distanceLabel) {
clearMarkers();
const resultsDiv = document.getElementById('results');
resultsDiv.innerHTML = '';

let validCount = 0;
const bounds = new google.maps.LatLngBounds();

results.forEach(place => {
const isExcluded = place.types.some(t => excludedTypes.includes(t));

if (!isExcluded && place.name) {
validCount++;

const placeLat = place.geometry.location.lat();
const placeLng = place.geometry.location.lng();

const distStr = calculateDistance(
referencePoint.lat(), referencePoint.lng(),
placeLat, placeLng
);

const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}&query_place_id=${place.place_id}`;

const marker = new google.maps.Marker({
map: map,
position: place.geometry.location,
title: place.name
});

const infoWindow = new google.maps.InfoWindow({
content: `<b>${place.name}</b><br>Udaljenost: ${distStr}<br><a href="${mapsUrl}" target="_blank">Otvori u Google Maps</a>`
});

marker.addListener('click', () => infoWindow.open(map, marker));
markers.push(marker);

if (place.geometry.viewport) {
bounds.union(place.geometry.viewport);
} else {
bounds.extend(place.geometry.location);
}

const galleryId = `gallery-${place.place_id}`;

const card = document.createElement('div');
card.className = 'card';
card.innerHTML = `
<h3>${place.name}</h3>
<p>${place.formatted_address || place.vicinity || 'Lokacija na mapi'}</p>
<div class="distance">📍 Udaljenost: ${distStr} (${distanceLabel})</div>
<div class="rating">Ocjena: ${place.rating ? place.rating + ' ★ (' + place.user_ratings_total + ' recenzija)' : 'Nema ocjene'}</div>
<div id="${galleryId}" class="photo-gallery"></div>
<a class="btn-maps" href="${mapsUrl}" target="_blank">🗺️ Otvori u Google Maps</a>
`;
resultsDiv.appendChild(card);

fetchPlaceDetails(place.place_id, galleryId);
}
});

if (validCount > 0) {
map.fitBounds(bounds);
document.getElementById('status').innerHTML = `Pronađeno <b>${validCount}</b> atrakcija u lokaciji: <b>${locationLabel}</b>.`;
} else {
document.getElementById('status').innerText = `Nisu pronađene čiste atrakcije (bez smještaja) za ${locationLabel}.`;
}
}

function fetchPlaceDetails(placeId, galleryDivId) {
const request = {
placeId: placeId,
fields: ['photos']
};

service.getDetails(request, (placeDetails, status) => {
if (status === google.maps.places.PlacesServiceStatus.OK && placeDetails && placeDetails.photos) {
const galleryDiv = document.getElementById(galleryDivId);
if (galleryDiv) {
let photosHtml = '';
const maxPhotos = Math.min(placeDetails.photos.length, 8);
for (let i = 0; i < maxPhotos; i++) {
const imgUrl = placeDetails.photos[i].getUrl({ maxWidth: 800, maxHeight: 600 });
photosHtml += `<img src="${imgUrl}" alt="Atrakcija" onclick="openModal('${imgUrl}')">`;
}
galleryDiv.innerHTML = photosHtml;
}
}
});
}

function clearMarkers() {
markers.forEach(m => m.setMap(null));
markers = [];
}

function openModal(url) {
document.getElementById('modalImg').src = url;
document.getElementById('imageModal').style.display = 'flex';
}

function closeModal() {
document.getElementById('imageModal').style.display = 'none';
}
</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCb3CdDumhMfJOsLazdIfJwXzQs4pXJ0Mk&libraries=places&callback=initMap">
</script>
</body>
</html>
