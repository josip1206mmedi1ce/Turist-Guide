<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0878e5">

<title>Turist Guide</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f6fa;
color:#182338;
}

header{
background:linear-gradient(135deg,#0878e5,#075bb5);
color:white;
padding:32px 20px 28px;
}

.wrap{
max-width:1100px;
margin:auto;
}

h1{
margin:0 0 8px;
font-size:42px;
}

.sub{
font-size:20px;
opacity:.95;
margin-bottom:22px;
}

.search{
display:flex;
gap:10px;
}

input{
flex:1;
min-width:0;
padding:18px 20px;
border:0;
border-radius:14px;
font-size:18px;
outline:none;
}

button{
border:0;
border-radius:14px;
padding:16px 22px;
font-size:17px;
font-weight:700;
cursor:pointer;
}

#searchBtn{
background:white;
color:#075bb5;
}

#nearBtn{
display:block;
width:100%;
margin-top:12px;
background:#eaf3ff;
color:#075bb5;
}

main{
padding:28px 20px 50px;
}

#status{
margin:0 0 20px;
font-size:19px;
color:#52637a;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.icon{
font-size:34px;
margin-bottom:10px;
}

.card h3{
margin:0 0 8px;
font-size:23px;
}

.meta{
color:#68778d;
font-size:15px;
line-height:1.45;
min-height:45px;
}

.map{
display:inline-block;
margin-top:16px;
padding:12px 18px;
border-radius:12px;
background:#0878e5;
color:white;
text-decoration:none;
font-weight:700;
}

.wiki{
display:inline-block;
margin-top:16px;
margin-left:6px;
padding:12px 18px;
border-radius:12px;
background:#eef3f8;
color:#29405e;
text-decoration:none;
font-weight:700;
}

.empty{
background:white;
border-radius:18px;
padding:28px;
text-align:center;
}

footer{
text-align:center;
color:#718096;
padding:30px 15px;
}

@media(max-width:600px){
h1{
font-size:34px;
}

.search{
flex-direction:column;
}

#searchBtn{
width:100%;
}
}
</style>
</head>

<body>

<header>
<div class="wrap">

<h1>Turist Guide</h1>

<div class="sub">
Pronađite turističke atrakcije u bilo kojem gradu
</div>

<div class="search">

<input
id="city"
placeholder="Npr. Dubrovnik, Tokyo, London..."
autocomplete="off"
>

<button id="searchBtn">🔎 Traži</button>

</div>

<button id="nearBtn">
📍 Atrakcije u mojoj blizini
</button>

</div>
</header>

<main class="wrap">

<div id="status">
Upišite grad i pritisnite „Traži“.
</div>

<div id="results" class="grid"></div>

</main>

<footer>
Turist Guide • Podaci o mjestima preko javnih izvora • Google Maps za lokacije
</footer>

<script>

const cityInput = document.getElementById("city");
const searchBtn = document.getElementById("searchBtn");
const nearBtn = document.getElementById("nearBtn");
const statusBox = document.getElementById("status");
const results = document.getElementById("results");


function mapsUrl(place, city){
return "https://www.google.com/maps/search/?api=1&query="
+ encodeURIComponent(place + ", " + city);
}


function escapeHtml(text){
return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


function showCard(place, city){

const title = place.title || "Turistička atrakcija";

const description =
place.description ||
"Znamenitost ili zanimljivo mjesto u blizini grada.";

const articleUrl =
place.fullurl ||
("https://en.wikipedia.org/wiki/" +
encodeURIComponent(title.replace(/ /g,"_")));

const card = document.createElement("article");

card.className = "card";

card.innerHTML = `
<div class="icon">📍</div>

<h3>${escapeHtml(title)}</h3>

<div class="meta">
${escapeHtml(description)}
</div>

<a
class="map"
target="_blank"
rel="noopener"
href="${mapsUrl(title, city)}"
>
📍 Google Maps
</a>

<a
class="wiki"
target="_blank"
rel="noopener"
href="${articleUrl}"
>
Wikipedia
</a>
`;

results.appendChild(card);
}


async function geocodeCity(city){

const url =
"https://nominatim.openstreetmap.org/search" +
"?format=jsonv2" +
"&limit=1" +
"&q=" +
encodeURIComponent(city);

const response = await fetch(url);

if(!response.ok){
throw new Error("Geocoding nije uspio.");
}

const data = await response.json();

if(!data.length){
return null;
}

return {
lat: parseFloat(data[0].lat),
lon: parseFloat(data[0].lon),
name: data[0].display_name
};
}


async function findAttractions(city){

const location = await geocodeCity(city);

if(!location){
throw new Error("Grad nije pronađen.");
}

const wikiUrl =
"https://en.wikipedia.org/w/api.php" +
"?action=query" +
"&generator=geosearch" +
"&ggsprimary=all" +
"&ggsnamespace=0" +
"&ggsradius=10000" +
"&ggslimit=20" +
"&prop=coordinates|description|info" +
"&inprop=url" +
"&format=json" +
"&origin=*" +
"&ggscoord=" +
location.lat + "|" + location.lon;

const response = await fetch(wikiUrl);

if(!response.ok){
throw new Error("Wikipedia pretraga nije uspjela.");
}

const data = await response.json();

if(!data.query || !data.query.pages){
return [];
}

return Object.values(data.query.pages)
.filter(p => p.title)
.slice(0,12);
}


async function search(){

const city = cityInput.value.trim();

if(!city){
statusBox.textContent =
"Upišite grad i pritisnite „Traži“.";

results.innerHTML = "";

return;
}

statusBox.textContent =
"🔎 Tražim turističke atrakcije za " + city + "...";

results.innerHTML = "";

searchBtn.disabled = true;

try{

const attractions = await findAttractions(city);

if(!attractions.length){

statusBox.textContent =
"Nisam pronašao automatski popis za " + city + ".";

results.innerHTML = `
<div class="empty">
<b>${escapeHtml(city)}</b><br><br>

Nema pronađenih podataka u ovom trenutku.

<br><br>

<a
class="map"
target="_blank"
rel="noopener"
href="${mapsUrl("turističke atrakcije",city)}"
>
📍 Otvori turističke atrakcije u Google Maps
</a>
</div>
`;

return;
}

statusBox.textContent =
"Pronađeno " + attractions.length +
" zanimljivih mjesta za " + city + ".";

attractions.forEach(place => {
showCard(place, city);
});

}catch(error){

console.error(error);

statusBox.textContent =
"Došlo je do problema pri pretrazi.";

results.innerHTML = `
<div class="empty">

<b>Pretraga trenutno nije uspjela.</b>

<br><br>

Možete odmah otvoriti Google Maps:

<br><br>

<a
class="map"
target="_blank"
rel="noopener"
href="${mapsUrl("turističke atrakcije",city)}"
>
📍 Google Maps
</a>

</div>
`;
}

finally{
searchBtn.disabled = false;
}
}


searchBtn.addEventListener("click", search);


cityInput.addEventListener("keydown", function(e){

if(e.key === "Enter"){
search();
}

});


nearBtn.addEventListener("click", function(){

const url =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent("turističke atrakcije u mojoj blizini");

window.open(url,"_blank");

});

</script>

</body>
</html>
