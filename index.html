<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turist Guide</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f9; color: #17212b; }

header { background: #0078e5; color: white; padding: 22px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); text-align: center; }
header h1 { margin: 0 0 6px 0; font-size: 24px; }
header p { margin: 0; font-size: 14px; opacity: 0.9; }

.main-container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

.search-box { display: flex; gap: 10px; margin-bottom: 12px; }
input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }

button { padding: 12px 18px; background: #0078e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
button:hover { background: #005bb5; }

.btn-near { background: #005bb5; margin-bottom: 15px; width: 100%; max-width: 250px; }

#map { width: 100%; height: 320px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

.status { margin-bottom: 15px; color: #555; font-size: 14px; }
.results-list { display: flex; flex-direction: column; gap: 10px; }

.card { background: white; padding: 14px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border-left: 4px solid #0078e5; }
.card h3 { margin: 0 0 6px 0; font-size: 17px; color: #0078e5; }
.card p { margin: 3px 0; font-size: 13px; color: #555; }
.card .rating { font-weight: bold; color: #f39c12; }
</style>
</head>
<body>

<header>
<h1>Turist Guide</h1>
<p>Pronađite turističke atrakcije u gradu</p>
</header>

<div class="main-container">
<div class="search-box">
<input type="text" id="cityInput" placeholder="Unesite grad (npr. dubrovnik)">
<button onclick="searchAttractions()">📍 Traži atrakcije</button>
</div>

<button class="btn-near" onclick="getNearAttractions()">📍 Atrakcije u mojoj blizini</button>

<div id="map"></div>

<div id="status" class="status">Unesite grad i kliknite "Traži atrakcije".</div>
<div class="results-list" id="results"></div>
</div>

<script>
let map;
let service;
let markers = [];

// Tipovi objekata koje strogo filtriramo i izbacujemo (hoteli, vile, restorani...)
const excludedTypes = [
'lodging', 'hotel', 'resort', 'guest_house', 'hostel',
'campground', 'restaurant', 'cafe', 'bar', 'food'
];

function initMap() {
// Početni prikaz (Dubrovnik)
const defaultPos = { lat: 42.6507, lng: 18.0944 };
map = new google.maps.Map(document.getElementById('map'), {
center: defaultPos,
zoom: 13
});
service = new google.maps.places.PlacesService(map);
}

function searchAttractions() {
const city = document.getElementById('cityInput').value.trim();
if (!city) {
alert('Molimo unesite grad.');
return;
}

document.getElementById('status').innerText = `Pretražujem atrakcije u gradu: ${city}...`;

const request = {
query: `tourist attractions point of interest in ${city}`,
type: 'tourist_attraction'
};

service.textSearch(request, (results, status) => {
if (status === google.maps.places.PlacesServiceStatus.OK && results) {
processResults(results, city);
} else {
document.getElementById('status').innerText = 'Greška pri pretrazi ili grad nije pronađen.';
}
});
}

function getNearAttractions() {
if (!navigator.geolocation) {
alert('Geolokacija nije podržana u vašem pregledniku.');
return;
}

document.getElementById('status').innerText = 'Dohvatam vašu lokaciju...';

navigator.geolocation.getCurrentPosition((pos) => {
const userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
map.setCenter(userLoc);
map.setZoom(14);

const request = {
location: userLoc,
radius: '4000',
type: 'tourist_attraction'
};

service.nearbySearch(request, (results, status) => {
if (status === google.maps.places.PlacesServiceStatus.OK && results) {
processResults(results, 'vašoj blizini');
} else {
document.getElementById('status').innerText = 'Nisu pronađene atrakcije u blizini.';
}
});
});
}

function processResults(results, locationLabel) {
clearMarkers();
const resultsDiv = document.getElementById('results');
resultsDiv.innerHTML = '';

let validCount = 0;
const bounds = new google.maps.LatLngBounds();

results.forEach(place => {
// Provjera da li objekat sadrži bilo koji od zabranjenih tipova (hotel, smještaj...)
const isExcluded = place.types.some(t => excludedTypes.includes(t));

if (!isExcluded && place.name) {
validCount++;

// Dodavanje pina na mapu
const marker = new google.maps.Marker({
map: map,
position: place.geometry.location,
title: place.name
});

const infoWindow = new google.maps.InfoWindow({
content: `<b>${place.name}</b><br>${place.formatted_address || ''}`
});

marker.addListener('click', () => infoWindow.open(map, marker));
markers.push(marker);

if (place.geometry.viewport) {
bounds.union(place.geometry.viewport);
} else {
bounds.extend(place.geometry.location);
}

// Prikaz kartice
const card = document.createElement('div');
card.className = 'card';
card.innerHTML = `
<h3>${place.name}</h3>
<p>${place.formatted_address || 'Lokacija na mapi'}</p>
<p class="rating">Ocjena: ${place.rating ? place.rating + ' ★ (' + place.user_ratings_total + ' recenzija)' : 'Nema ocjene'}</p>
`;
resultsDiv.appendChild(card);
}
});

if (validCount > 0) {
map.fitBounds(bounds);
document.getElementById('status').innerHTML = `Pronađeno <b>${validCount}</b> atrakcija u lokaciji: <b>${locationLabel}</b>.`;
} else {
document.getElementById('status').innerText = `Nisu pronađene čiste atrakcije (bez smještaja) za ${locationLabel}.`;
}
}

function clearMarkers() {
markers.forEach(m => m.setMap(null));
markers = [];
}
</script>

<!-- ZAMIJENITE "TVOJ_GOOGLE_API_KLJUC" S VAŠIM PRAVIM API KLJUČEM -->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCb3CdDumhMfJOsLazdIfJwXzQs4pXJ0Mk&libraries=places&callback=initMap">
</script>
</body>
</html>
