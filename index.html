<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turist Guide</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f6fa;
color:#182338
}
header{
background:linear-gradient(135deg,#0878e5,#075bb5);
color:white;
padding:30px 20px 35px;
text-align:center
}
h1{font-size:42px;margin:0 0 8px}
.sub{font-size:20px;margin-bottom:25px}
.search{
display:flex;
max-width:850px;
margin:auto;
gap:10px
}
input{
flex:1;
padding:18px;
border:0;
border-radius:15px;
font-size:20px;
outline:none
}
button{
border:0;
border-radius:15px;
padding:15px 22px;
font-size:18px;
font-weight:700;
cursor:pointer;
background:white;
color:#075bb5
}
.near{
max-width:850px;
margin:15px auto 0;
background:#dcecff;
color:#075bb5;
width:100%
}
main{
max-width:1100px;
margin:auto;
padding:30px 20px
}
#status{
font-size:22px;
margin-bottom:25px;
color:#52647d
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px
}
.card{
background:white;
border-radius:20px;
padding:22px;
box-shadow:0 5px 20px #00000012
}
.icon{font-size:38px}
.card h2{
margin:12px 0 8px;
font-size:24px
}
.meta{
color:#687890;
min-height:45px
}
.links{
display:flex;
gap:10px;
margin-top:18px
}
.links a{
flex:1;
text-align:center;
padding:13px 8px;
border-radius:12px;
text-decoration:none;
font-weight:700
}
.maps{
background:#0878e5;
color:white
}
.osm{
background:#edf2f7;
color:#234
}
.empty{
text-align:center;
background:white;
padding:40px;
border-radius:20px
}
@media(max-width:600px){
h1{font-size:34px}
.search{flex-direction:column}
button{width:100%}
}
</style>
</head>

<body>

<header>
<h1>📍 Turist Guide</h1>
<div class="sub">Pronađite turističke atrakcije u bilo kojem gradu</div>

<div class="search">
<input id="city" placeholder="Upišite grad, npr. Dubrovnik">
<button id="searchBtn">🔎 Traži</button>
</div>

<button class="near" id="nearBtn">
📍 Atrakcije u mojoj blizini
</button>
</header>

<main>
<div id="status">Upišite grad i pritisnite Traži.</div>
<div id="results"></div>
</main>

<script>

const cityInput=document.getElementById("city");
const searchBtn=document.getElementById("searchBtn");
const nearBtn=document.getElementById("nearBtn");
const status=document.getElementById("status");
const results=document.getElementById("results");

function mapsUrl(name,city){
return "https://www.google.com/maps/search/?api=1&query="
+encodeURIComponent(name+" "+city);
}

function icon(type){
if(type==="museum") return "🏛️";
if(type==="castle") return "🏰";
if(type==="viewpoint") return "🌄";
if(type==="church") return "⛪";
if(type==="monument") return "🗿";
if(type==="park") return "🌳";
if(type==="zoo") return "🦁";
if(type==="gallery") return "🎨";
return "📍";
}

async function searchCity(){

const city=cityInput.value.trim();

if(!city){
status.textContent="Molimo upišite grad.";
return;
}

status.textContent="🔎 Tražim turističke atrakcije za "+city+"...";
results.innerHTML="";

try{

const geo=await fetch(
"https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
+encodeURIComponent(city)
);

const places=await geo.json();

if(!places.length){
status.textContent="Grad nije pronađen.";
return;
}

const lat=places[0].lat;
const lon=places[0].lon;

const query=`
[out:json][timeout:25];
(
node["tourism"](around:15000,${lat},${lon});
way["tourism"](around:15000,${lat},${lon});
relation["tourism"](around:15000,${lat},${lon});

node["historic"](around:15000,${lat},${lon});
way["historic"](around:15000,${lat},${lon});
relation["historic"](around:15000,${lat},${lon});
);
out center tags;
`;

const response=await fetch(
"https://overpass-api.de/api/interpreter",
{
method:"POST",
body:query
}
);

const data=await response.json();

const list=data.elements
.filter(x=>{
const t=x.tags || {};

return (
t.historic ||
t.tourism === "attraction" ||
t.tourism === "museum" ||
t.tourism === "gallery" ||
t.tourism === "theme_park" ||
t.tourism === "zoo" ||
t.tourism === "aquarium" ||
t.tourism === "viewpoint" ||
t.tourism === "artwork" ||
t.tourism === "information"
);
})
.map(x=>({
name:x.tags?.name,
type:x.tags?.tourism || x.tags?.historic || "attraction",
lat:x.center?.lat,
lon:x.center?.lon
}))
.filter(x=>x.name)
.slice(0,20);

const unique=[];
const seen=new Set();

for(const item of list){
if(!seen.has(item.name)){
seen.add(item.name);
unique.push(item);
}
}

list=unique.slice(0,20);

if(!list.length){
status.textContent="Nema pronađenih atrakcija za ovaj grad.";
return;
}

status.textContent=
"Pronađeno "+list.length+
" zanimljivih mjesta za "+city+".";

const grid=document.createElement("div");
grid.className="grid";

list.forEach(item=>{

const card=document.createElement("article");
card.className="card";

const google=mapsUrl(item.name,city);

const osm=
"https://www.openstreetmap.org/?mlat="
+item.lat+"&mlon="+item.lon;

card.innerHTML=`
<div class="icon">${icon(item.type)}</div>
<h2>${item.name}</h2>
<div class="meta">${item.type}</div>
<div class="links">
<a class="maps" target="_blank" href="${google}">
📍 Google Maps
</a>
<a class="osm" target="_blank" href="${osm}">
OpenStreetMap
</a>
</div>
`;

grid.appendChild(card);
});

results.appendChild(grid);

}catch(error){

console.error(error);

status.textContent=
"Došlo je do greške pri dohvaćanju podataka. Pokušajte ponovo.";
}
}

searchBtn.addEventListener("click",searchCity);

cityInput.addEventListener("keydown",function(e){
if(e.key==="Enter") searchCity();
});

nearBtn.addEventListener("click",function(){

if(!navigator.geolocation){
status.textContent="Vaš uređaj ne podržava lokaciju.";
return;
}

status.textContent="📍 Tražim atrakcije u vašoj blizini...";

navigator.geolocation.getCurrentPosition(async function(pos){

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

cityInput.value="Moja lokacija";

const query=`
[out:json][timeout:25];
(
node["tourism"="attraction"](around:15000,${lat},${lon});
way["tourism"="attraction"](around:15000,${lat},${lon});
relation["tourism"="attraction"](around:15000,${lat},${lon});

node["tourism"="museum"](around:15000,${lat},${lon});
way["tourism"="museum"](around:15000,${lat},${lon});
relation["tourism"="museum"](around:15000,${lat},${lon});

node["tourism"="gallery"](around:15000,${lat},${lon});
way["tourism"="gallery"](around:15000,${lat},${lon});

node["tourism"="viewpoint"](around:15000,${lat},${lon});
way["tourism"="viewpoint"](around:15000,${lat},${lon});

node["tourism"="zoo"](around:15000,${lat},${lon});
way["tourism"="zoo"](around:15000,${lat},${lon});

node["tourism"="aquarium"](around:15000,${lat},${lon});
way["tourism"="aquarium"](around:15000,${lat},${lon});

node["tourism"="theme_park"](around:15000,${lat},${lon});
way["tourism"="theme_park"](around:15000,${lat},${lon});

node["historic"="monument"](around:15000,${lat},${lon});
way["historic"="monument"](around:15000,${lat},${lon});

node["historic"="castle"](around:15000,${lat},${lon});
way["historic"="castle"](around:15000,${lat},${lon});

node["historic"="fort"](around:15000,${lat},${lon});
way["historic"="fort"](around:15000,${lat},${lon});

node["historic"="memorial"](around:15000,${lat},${lon});
way["historic"="memorial"](around:15000,${lat},${lon});

node["historic"="archaeological_site"](around:15000,${lat},${lon});
way["historic"="archaeological_site"](around:15000,${lat},${lon});

node["historic"="ruins"](around:15000,${lat},${lon});
way["historic"="ruins"](around:15000,${lat},${lon});
);
out center tags;
`;

try{

const response=await fetch(
"https://overpass.private.coffee/api/interpreter",
{
method:"POST",
body:"data=+encodeURIComponent(query)
}
);

const data=await response.json();

const list=data.elements
.map(x=>({
name:x.tags?.name,
type:x.tags?.tourism || x.tags?.historic || "attraction",
lat:x.lat || x.center?.lat,
lon:x.lon || x.center?.lon
}))
.filter(x=>x.name)
.slice(0,20);

status.textContent=
"Pronađeno "+list.length+
" atrakcija u vašoj blizini.";

results.innerHTML="";

const grid=document.createElement("div");
grid.className="grid";

list.forEach(item=>{

const card=document.createElement("article");
card.className="card";

card.innerHTML=`
<div class="icon">${icon(item.type)}</div>
<h2>${item.name}</h2>
<div class="meta">${item.type}</div>
<div class="links">
<a class="maps" target="_blank"
href="${mapsUrl(item.name,"moja lokacija")}">
📍 Google Maps
</a>
</div>
`;

grid.appendChild(card);
});

results.appendChild(grid);

}catch(e){
status.textContent="Nije moguće dohvatiti podatke.";
}

});

});

</script>

</body>
</html>
