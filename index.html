<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turist Guide</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f7f9;
color: #17212b;
}

header {
background: #0878e5;
color: white;
padding: 22px 16px;
box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.wrap {
max-width: 1200px;
margin: auto;
}

h1 {
margin: 0 0 6px;
font-size: 30px;
}

.subtitle {
margin-bottom: 18px;
opacity: .95;
}

.search {
display: flex;
gap: 10px;
flex-wrap: wrap;
}

#city {
flex: 1;
min-width: 220px;
padding: 14px;
border: none;
border-radius: 10px;
font-size: 16px;
}

button {
border: none;
border-radius: 10px;
padding: 13px 18px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
}

#searchBtn {
background: white;
color: #0878e5;
}

#nearBtn {
margin-top: 12px;
background: #075fae;
color: white;
}

main {
max-width: 1200px;
margin: 20px auto;
padding: 0 16px;
}

#status {
background: white;
padding: 15px;
border-radius: 10px;
margin-bottom: 15px;
box-shadow: 0 1px 5px rgba(0,0,0,.08);
}

#map {
width: 100%;
height: 450px;
border-radius: 14px;
overflow: hidden;
margin-bottom: 20px;
box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 16px;
}

.card {
background: white;
border-radius: 14px;
padding: 18px;
box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.card h2 {
margin: 0 0 10px;
font-size: 20px;
}

.rating {
color: #e39b00;
font-weight: bold;
margin-bottom: 8px;
}

.address {
color: #66727d;
font-size: 14px;
line-height: 1.4;
margin-bottom: 15px;
}

.mapLink {
display: inline-block;
background: #0878e5;
color: white;
text-decoration: none;
padding: 10px 14px;
border-radius: 8px;
font-weight: bold;
}

.empty {
background: white;
padding: 25px;
border-radius: 14px;
text-align: center;
}

footer {
text-align: center;
color: #687580;
padding: 30px 15px;
}

@media (max-width: 600px) {
h1 {
font-size: 25px;
}

#map {
height: 360px;
}

.search {
flex-direction: column;
}

#searchBtn {
width: 100%;
}
}
</style>
</head>

<body>

<header>
<div class="wrap">

<h1>Turist Guide</h1>

<div class="subtitle">
Pronađite turističke atrakcije u gradu
</div>

<div class="search">
<input
id="city"
type="text"
placeholder="Npr. Dubrovnik, Mostar, Split..."
autocomplete="off"
>

<button id="searchBtn">
🔎 Traži atrakcije
</button>
</div>

<button id="nearBtn">
📍 Atrakcije u mojoj blizini
</button>

</div>
</header>

<main>

<div id="status">
Unesite grad i kliknite „Traži atrakcije“.
</div>

<div id="map"></div>

<div id="results" class="grid"></div>

</main>

<footer>
Turist Guide • Podaci i lokacije putem Google Maps Platforma
</footer>


<script>
/*
====================================================
GOOGLE MAPS API KLJUČ
====================================================
*/

const API_KEY = "AIzaSyCb3CdDumhMfJOsLazdIfJwXzQs4pXJ0Mk";


/*
====================================================
GLOBALNE VARIJABLE
====================================================
*/

let map;
let infoWindow;
let markers = [];


/*
====================================================
POKRETANJE GOOGLE MAPS
====================================================
*/

async function initApp() {

const { Map, InfoWindow } =
await google.maps.importLibrary("maps");

await google.maps.importLibrary("places");

await google.maps.importLibrary("marker");

map = new Map(document.getElementById("map"), {
center: {
lat: 43.5081,
lng: 16.4402
},

zoom: 7,

mapId: "DEMO_MAP_ID"
});

infoWindow = new InfoWindow();

console.log("Google Maps je pokrenut.");
}


/*
====================================================
BRISANJE STARIH MARKERA
====================================================
*/

function clearMarkers() {

markers.forEach(marker => {
marker.map = null;
});

markers = [];
}


/*
====================================================
PRIKAZ ATRAKCIJA
====================================================
*/

function showPlaces(places, naslov) {

const results = document.getElementById("results");

results.innerHTML = "";

clearMarkers();

if (!places || places.length === 0) {

document.getElementById("status").textContent =
"Nismo pronašli turističke atrakcije za ovaj upit.";

results.innerHTML = `
<div class="empty">
<h2>Nema rezultata</h2>
<p>Pokušajte s drugim gradom.</p>
</div>
`;

return;
}


document.getElementById("status").textContent =
naslov + " • pronađeno atrakcija: " + places.length;


const bounds = new google.maps.LatLngBounds();


places.forEach((place, index) => {

if (!place.location) {
return;
}


/*
================================================
MARKER
================================================
*/

const marker =
new google.maps.marker.AdvancedMarkerElement({
map: map,
position: place.location,
title: place.displayName || "Turistička atrakcija"
});


markers.push(marker);

bounds.extend(place.location);


/*
================================================
INFO PROZOR
================================================
*/

marker.addListener("click", () => {

const content = `
<div style="max-width:260px">
<strong>
${escapeHtml(place.displayName || "Turistička atrakcija")}
</strong>
<br><br>

${
place.rating
? "⭐ " + place.rating
: ""
}

<br>

${
place.googleMapsURI
? `<br>
<a href="${place.googleMapsURI}"
target="_blank"
rel="noopener">
Otvori u Google Maps
</a>`
: ""
}
</div>
`;

infoWindow.setContent(content);

infoWindow.open({
map: map,
anchor: marker
});

});


/*
================================================
KARTICA
================================================
*/

const card = document.createElement("article");

card.className = "card";


const title =
place.displayName ||
"Turistička atrakcija";


const rating =
place.rating
? `<div class="rating">
⭐ ${place.rating}
</div>`
: "";


const address =
place.formattedAddress
? `<div class="address">
📍 ${escapeHtml(place.formattedAddress)}
</div>`
: "";


const mapLink =
place.googleMapsURI
? `<a
class="mapLink"
href="${place.googleMapsURI}"
target="_blank"
rel="noopener">
Otvori u Google Maps
</a>`
: "";


card.innerHTML = `
<h2>${escapeHtml(title)}</h2>

${rating}

${address}

${mapLink}
`;


results.appendChild(card);

});


/*
================================================
AUTOMATSKI ZOOM NA REZULTATE
================================================
*/

if (!bounds.isEmpty()) {

map.fitBounds(bounds);

if (places.length === 1) {
map.setZoom(15);
}
}
}


/*
====================================================
TRAŽENJE ATRAKCIJA U GRADU
====================================================
*/

async function searchCity() {

const input =
document.getElementById("city");

const city =
input.value.trim();


if (!city) {

document.getElementById("status").textContent =
"Molimo unesite grad.";

return;
}


document.getElementById("status").textContent =
"Tražim turističke atrakcije u gradu " +
city + "...";


document.getElementById("results").innerHTML = "";


try {

const { Place } =
await google.maps.importLibrary("places");


const request = {

textQuery:
"turističke atrakcije u " + city,

includedType:
"tourist_attraction",

useStrictTypeFiltering:
true,

language:
"hr",

region:
"HR",

maxResultCount:
20,

fields: [
"displayName",
"formattedAddress",
"location",
"rating",
"googleMapsURI"
]
};


const { places } =
await Place.searchByText(request);


showPlaces(
places,
"Turističke atrakcije: " + city
);


} catch (error) {

console.error(error);

document.getElementById("status").textContent =
"Greška pri pretraživanju Google Places API-ja.";

document.getElementById("results").innerHTML = `
<div class="empty">
<h2>Došlo je do greške</h2>
<p>
Provjerite API ključ i postavke Google Maps Platforme.
</p>
</div>
`;
}
}


/*
====================================================
ATRAKCIJE U BLIZINI
====================================================
*/

function findNearby() {

if (!navigator.geolocation) {

document.getElementById("status").textContent =
"Vaš uređaj ne podržava određivanje lokacije.";

return;
}


document.getElementById("status").textContent =
"Dohvaćam vašu lokaciju...";


navigator.geolocation.getCurrentPosition(

async position => {

const center = {

lat: position.coords.latitude,

lng: position.coords.longitude

};


map.setCenter(center);

map.setZoom(13);


try {

const { Place } =
await google.maps.importLibrary("places");


const request = {

fields: [
"displayName",
"formattedAddress",
"location",
"rating",
"googleMapsURI"
],

locationRestriction: {

center: center,

radius: 30000

},

includedPrimaryTypes: [
"tourist_attraction"
],

maxResultCount: 20,

language: "hr",

region: "HR"
};


const { places } =
await Place.searchNearby(request);


showPlaces(
places,
"Turističke atrakcije u vašoj blizini"
);


} catch (error) {

console.error(error);

document.getElementById("status").textContent =
"Greška pri pronalaženju atrakcija u blizini.";
}

},


error => {

console.error(error);

document.getElementById("status").textContent =
"Nije moguće dobiti vašu lokaciju. Dopustite pristup lokaciji u pregledniku.";

},

{
enableHighAccuracy: true,
timeout: 10000,
maximumAge: 60000
}

);
}


/*
====================================================
ZAŠTITA TEKSTA OD HTML-A
====================================================
*/

function escapeHtml(text) {

return String(text)
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");
}


/*
====================================================
GUMBI
====================================================
*/

document
.getElementById("searchBtn")
.addEventListener("click", searchCity);


document
.getElementById("nearBtn")
.addEventListener("click", findNearby);


document
.getElementById("city")
.addEventListener("keydown", event => {

if (event.key === "Enter") {

searchCity();

}

});


/*
====================================================
POKRENI APLIKACIJU
====================================================
*/

initApp();

</script>


<!--
====================================================
GOOGLE MAPS JAVASCRIPT API
====================================================
-->

</script>

</body>
</html>
